services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: devstate
      POSTGRES_USER: devstate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell environment}
    volumes:
      - devstate_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devstate -d devstate"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "api,localhost,127.0.0.1"
      DATABASE_URL: postgresql://devstate:${POSTGRES_PASSWORD}@db:5432/devstate
      DEVSTATE_RECOVERY_DIR: /app/data/recovery
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      DEVSTATE_API_URL: http://api:8000/api/
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  devstate_postgres:
