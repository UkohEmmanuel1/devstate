name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py check
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
          DJANGO_DEBUG: "true"
          CLERK_ISSUER: https://example.clerk.accounts.dev/
          CLERK_JWKS_URL: https://example.clerk.accounts.dev/.well-known/jwks.json
      - run: python backend/manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
          DJANGO_DEBUG: "true"
          CLERK_ISSUER: https://example.clerk.accounts.dev/
          CLERK_JWKS_URL: https://example.clerk.accounts.dev/.well-known/jwks.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGV2c3RhdGUuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          DEVSTATE_API_URL: http://127.0.0.1:8000/api/
